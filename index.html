<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>🧸 扬帆中文 · 儿童识字量评估</title>
    <style>
        /* 原有样式保持不变 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Comic Sans MS', 'Chalkboard SE', '幼圆', 'Yuanti SC', 'PingFang', sans-serif;
        }
        body {
            background: linear-gradient(145deg, #b8e1fc 0%, #d0f0fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .test-box {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 30px rgba(0, 30, 50, 0.2), inset 0 2px 5px rgba(255,255,255,0.7);
            padding: 28px 20px 35px;
            border: 4px solid white;
        }
        .logo-area {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        .logo-area img {
            max-height: 70px;
            width: auto;
            object-fit: contain;
        }
        .start-panel, .finish-panel {
            background: #fffcd9;
            border-radius: 60px;
            padding: 30px 20px;
            text-align: center;
            border: 8px solid #ffa54d;
            box-shadow: 0 10px 0 #b45f1b;
        }
        .start-panel h1, .finish-panel h2 {
            font-size: 2.4rem;
            color: #963c0c;
            margin: 10px 0 15px;
        }
        .info-note {
            background: #e2f2fe;
            border-radius: 40px;
            padding: 18px 15px;
            font-size: 1.3rem;
            color: #024d7a;
            border: 3px solid #8fcbff;
            text-align: left;
            margin: 20px 0;
            line-height: 1.7;
        }
        .info-note small {
            font-size: 1.2rem;
            display: block;
            margin-top: 8px;
            color: #1d6f9e;
        }
        .btn-start {
            background: #ffb054;
            border: none;
            width: 100%;
            padding: 20px;
            border-radius: 60px;
            font-size: 2.4rem;
            font-weight: bold;
            color: #362813;
            box-shadow: 0 8px 0 #b7611e;
            cursor: pointer;
            border: 3px solid #ffeec2;
            letter-spacing: 3px;
            transition: 0.08s;
        }
        .btn-start:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b7611e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffb56b;
            padding: 16px 20px;
            border-radius: 50px;
            color: #2d3e50;
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: 2px 2px 0 #ffe0a3;
            box-shadow: 0 6px 0 #e07c2e;
            margin-bottom: 20px;
        }
        .score-badge {
            background: #feecc8;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 1.6rem;
            color: #a34f0e;
            box-shadow: inset 0 -3px 0 #dba871;
        }
        .question-area {
            background: #fffcd9;
            border-radius: 100px;
            padding: 15px 10px;
            margin: 10px 0 30px;
            border: 5px solid #feae3a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            box-shadow: 0 8px 0 #c97d21;
        }
        .voice-btn {
            background: #ffdd99;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 2.8rem;
            cursor: pointer;
            box-shadow: 0 7px 0 #b47d44, 0 10px 15px rgba(0,0,0,0.1);
            transition: all 0.05s ease;
            line-height: 1;
            color: #5e3a1d;
            flex-shrink: 0;
        }
        .voice-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b47d44;
        }
        .voice-hint {
            font-size: 2.2rem;
            background: #fdea9c;
            border-radius: 50px;
            padding: 10px 25px;
            color: #422a0f;
            letter-spacing: 2px;
            box-shadow: inset 0 -3px 0 #bc8d4f;
            word-break: keep-all;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 30px 0 20px;
        }
        .option-btn {
            background: #c7e6b4;
            border: 5px solid #fefbda;
            padding: 25px 5px;
            border-radius: 70px;
            font-size: 4.2rem;
            font-weight: bold;
            color: #1f4f2b;
            box-shadow: 0 9px 0 #679436, 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.06s ease;
            text-align: center;
            line-height: 1.2;
            letter-spacing: 4px;
        }
        .option-btn:active {
            transform: translateY(6px);
            box-shadow: 0 3px 0 #3f6b2a;
        }
        .option-btn.disabled, .option-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 5px 0 #4f6b3a;
            pointer-events: none;
        }
        .next-btn {
            background: #ffb054;
            border: none;
            width: 100%;
            padding: 20px;
            border-radius: 60px;
            font-size: 2.2rem;
            font-weight: bold;
            color: #362813;
            box-shadow: 0 8px 0 #b7611e;
            cursor: pointer;
            transition: 0.08s;
            margin-top: 15px;
            border: 3px solid #ffeec2;
            letter-spacing: 3px;
        }
        .next-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b7611e;
        }
        .next-btn.hidden {
            display: none;
        }

            min-height: 60px;
            font-size: 1.9rem;
            padding: 8px 15px;
            background: #e2f2fe;
            border-radius: 40px;
            margin: 10px 0 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #8fcbff;
            color: #024d7a;
        }
        .finish-panel .result-number {
            font-size: 5rem;
            background: #ffc97a;
            display: inline-block;
            padding: 10px 50px;
            border-radius: 120px;
            margin: 20px 0;
            border: 5px solid white;
        }
        .contact-info {
            background: #fee5b1;
            border-radius: 40px;
            padding: 15px;
            margin: 25px 0 15px;
            font-size: 1.5rem;
            color: #42280b;
            border: 3px solid #ffb26e;
            line-height: 2;
        }
        .contact-info a {
            color: #b0450e;
            text-decoration: none;
            font-weight: bold;
            word-break: break-word;
        }
        .restart-btn {
            background: #73b56e;
            border: none;
            padding: 20px 35px;
            border-radius: 50px;
            font-size: 2.2rem;
            color: white;
            text-shadow: 2px 2px 0 #2d6325;
            box-shadow: 0 7px 0 #36752d;
            cursor: pointer;
            margin-top: 10px;
        }
        .small-note {
            font-size: 1.2rem;
            color: #454545;
            margin-top: 10px;
        }
        /* 微信引导浮层样式 */
        .wechat-guide {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            backdrop-filter: blur(3px);
        }
        .guide-box {
            background: white;
            border-radius: 30px;
            padding: 30px 25px;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 30px rgba(0,0,0,0.3);
            position: relative;
        }
        .guide-box .arrow {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 5px;
            display: inline-block;
            transform: rotate(90deg); /* 让箭头指向右上 */
        }
        .guide-box p {
            font-size: 1.8rem;
            color: #333;
            margin: 15px 0;
            font-weight: bold;
        }
        .guide-box .tip {
            font-size: 1.4rem;
            color: #666;
            margin-bottom: 20px;
        }
        .guide-box .close-btn {
            background: #ffb054;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-size: 1.6rem;
            color: #362813;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b7611e;
            transition: 0.05s;
            border: 2px solid #ffeec2;
            margin-top: 10px;
        }
        .guide-box .close-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b7611e;
        }
        @media (max-width: 500px) {
            .option-btn { font-size: 3.2rem; padding: 15px 5px; }
            .voice-hint { font-size: 1.8rem; }
            .header { font-size: 1.2rem; }
            .contact-info { font-size: 1.3rem; }
        }

        var ua = navigator.userAgent.toLowerCase();
        return ua.indexOf('micromessenger') !== -1;
    }

    // 如果在微信中，显示引导浮层
    if (isWeChat()) {
        // 创建浮层元素
        var guideDiv = document.createElement('div');
        guideDiv.className = 'wechat-guide';
        guideDiv.id = 'wechatGuide';
        guideDiv.innerHTML = `
            <div class="guide-box">
                <div class="arrow">↗️</div>
                <p>请在浏览器中打开</p>
                <div class="tip">点击右上角 <strong>···</strong> 选择<br>「在浏览器中打开」</div>
                <button class="close-btn" id="closeGuide">我知道了</button>
            </div>
        `;
        document.body.appendChild(guideDiv);

        // 点击按钮关闭浮层
        document.getElementById('closeGuide').addEventListener('click', function() {
            guideDiv.remove();
        });

        // 也可以点击背景关闭（可选）
        guideDiv.addEventListener('click', function(e) {
            if (e.target === guideDiv) {
                guideDiv.remove();
            }
        });

        utterance.rate = 0.9;
        utterance.pitch = 1.2;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

        let others = [];
        while (others.length < 3) {
            const rand = ALL_WORDS[Math.floor(Math.random() * ALL_WORDS.length)];
            if (rand !== correct && !others.includes(rand)) others.push(rand);
        }
        let opts = [correct, ...others];
        for (let i = opts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [opts[i], opts[j]] = [opts[j], opts[i]];
        }
        return opts;
    }

        score = 0;
        quizFinished = false;
        answered = false;
        renderQuestion();

            </div>

            <div class="message-bar" id="message">✨ 点击正确的汉字吧～</div>
            <button class="next-btn hidden" id="nextBtn">➡️ 下一题</button>
        `;

            speak(phrase);
        });

                if (answered) return;
                const selected = e.currentTarget.dataset.word;

                document.getElementById('message').innerHTML = isCorrect ? '🎉 太棒啦！答对了！' : `😢 正确答案是 “${correctWord}”`;

                });
                document.getElementById('nextBtn').classList.remove('hidden');
            });
        });

        });
